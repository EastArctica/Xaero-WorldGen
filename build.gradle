plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	mods {
		"xaero-worldgen" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // sodium+mc26.2-0.9.1-beta.3-fabric
	implementation "maven.modrinth:AANobbMI:jvfEutyx"
    // Xaero's World Map+fabric-26.2-1.41.3
	implementation "maven.modrinth:NcUtCpym:5OKukukw"
    // Xaero's Minimap+fabric-26.2-26.1.3
	implementation "maven.modrinth:1bokaNcj:e1D3Ei69"
    // Voxy+0.2.17-alpha
	implementation "maven.modrinth:fxxUqruK:hUUcusfA"
    // Voxy worldgen+2.4.2
	implementation "maven.modrinth:xT0lnNE9:II0QK5sq"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}
